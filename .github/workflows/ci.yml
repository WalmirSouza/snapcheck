name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: snapcheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d snapcheck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar dependências
        run: dotnet restore SnapCheck.sln

      - name: Build (com análise estática — warnings de código quebram o build)
        # WarningsNotAsErrors exclui NU1902/NU1903 (vulnerabilidade de pacote) do
        # warnaserror: essas duas são tratadas à parte no step de scan abaixo,
        # que só bloqueia para severidade Crítica (critério de aceite do item 10.4).
        run: >
          dotnet build SnapCheck.sln --no-restore --configuration Release
          -p:EnableNETAnalyzers=true -p:AnalysisLevel=latest -p:TreatWarningsAsErrors=true
          -p:WarningsNotAsErrors=NU1902%3BNU1903

      - name: Testes
        env:
          SNAPCHECK_TEST_CONNECTION_STRING: "Host=localhost;Port=5432;Database=snapcheck;Username=ci_test;Password=ci_test"
        run: dotnet test tests/SnapCheck.Tests/SnapCheck.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Scan de dependências vulneráveis
        run: |
          dotnet list SnapCheck.sln package --vulnerable --include-transitive --format json > vulnerable.json
          cat vulnerable.json
          CRITICAL_COUNT=$(jq '[.projects[].frameworks[]? | ((.topLevelPackages // []) + (.transitivePackages // []))[] | select(.vulnerabilities != null) | .vulnerabilities[] | select(.severity == "Critical")] | length' vulnerable.json)
          echo "Vulnerabilidades críticas encontradas: $CRITICAL_COUNT"
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::Encontrada(s) $CRITICAL_COUNT vulnerabilidade(s) crítica(s) de dependência — build bloqueado."
            exit 1
          fi
