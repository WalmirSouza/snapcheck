services:
  postgres:
    image: postgres:16-alpine
    container_name: snapcheck-postgres
    environment:
      POSTGRES_USER: snapcheck
      POSTGRES_PASSWORD: snapcheck
      POSTGRES_DB: snapcheck
    ports:
      # Porta do host mapeada para 5439 (não 5432) porque a máquina de
      # desenvolvimento já tem várias instâncias de Postgres ocupando as portas
      # usuais (5432 nativo do Windows, 5433/5434 de outros projetos em
      # docker-compose) — conflito de infraestrutura local, não afeta a rede
      # interna do docker-compose (o app continua falando com "postgres:5432"
      # via snapcheck-net).
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - snapcheck-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapcheck -d snapcheck"]
      interval: 5s
      timeout: 5s
      retries: 5

  snapcheck:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snapcheck-app
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Database=snapcheck;Username=snapcheck;Password=snapcheck
      Admin__ApiKey: dev-local-only
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - snapcheck-net

networks:
  snapcheck-net:
    driver: bridge

volumes:
  postgres_data:
